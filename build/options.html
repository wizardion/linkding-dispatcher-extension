iv><div id="token-error" class="text-danger small mt-2" role="alert" aria-live="polite"></div><ul id="token-list" class="list-group mt-3" aria-label="Added API tokens"></ul><p id="no-tokens" class="text-muted small mt-2 mb-0">No API tokens added yet.</p></section><div class="mb-4"><label class="form-label" for="current-token">Current token</label> <select id="current-token" class="form-select" required aria-describedby="current-token-help"><option value="">Add a token first</option></select><div id="current-token-help" class="form-text">This token will be used to authenticate popup requests.</div></div><div class="d-flex align-items-center gap-3"><button id="save-settings" class="btn btn-primary" type="submit">Save settings</button> <span id="save-status" class="text-success" role="status" aria-live="polite"></span></div></form></main><script defer="defer" src="./js/options.051422ca5febc0d80a79.js"></script></body></html>
